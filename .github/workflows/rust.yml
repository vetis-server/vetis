name: Rust

permissions:
  contents: read

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test all
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        path: 'vetis'

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        repository: 'vetis-server/vetis-tokio'
        path: 'vetis-tokio'

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        repository: 'ararog/hyper-body-utils'
        path: 'hyper-body-utils'

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2

    - name: Install nextest
      uses: taiki-e/install-action@nextest

    - name: Run all tests
      run: |
          cd vetis
          cargo nextest run -j1 --no-fail-fast
