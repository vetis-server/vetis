[package]
name = "vetis-macros"
version = "0.1.3-beta.1"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Very Tiny Server macros"
readme = "README.md"
license.workspace = true
keywords = ["http", "networking", "macros"]
publish = true
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = "3.0.5"
vetis = { workspace = true, default-features = false }

[dev-dependencies]
caramelo = "0.1.4"
http = "1"
tokio = { version = "1.53.1", features = ["macros"] }
trybuild = "1.0.120"
vetis-tokio = "0.1.2-beta.1"
