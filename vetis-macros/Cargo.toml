[package]
name = "vetis-macros"
version = "0.1.3-beta.7"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Very Tiny Server macros"
readme = "README.md"
license.workspace = true
keywords = ["http", "networking", "macros"]
publish = true
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.9" }
vetis = { workspace = true }

[dev-dependencies]
arcstr = { workspace = true }
caramelo.workspace = true
http = { workspace = true }
tokio = { version = "1.53.1", features = ["macros"] }
trybuild = "1.0.121"
vetis-tokio.workspace = true
