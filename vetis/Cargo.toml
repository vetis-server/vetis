[package]
name = "vetis"
version = "0.1.7-beta.6"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Very Tiny Server"
readme = "README.md"
license.workspace = true
keywords = ["http", "networking", "server", "rest-server"]
publish = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = []

[dependencies]
arcstr = { workspace = true }
crossfire = "3.1.20"
http = { workspace = true }
http-serde-ext = "1.0.2"
hyper = { workspace = true, default-features = false, features = ["server"] }
hyper-body-utils = { workspace = true }
log.workspace = true
logforth-core.workspace = true
papaya = "0.2.5"
patricia_tree = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
thiserror = { workspace = true }
time = { workspace = true, features = ["formatting"] }
typetag = { workspace = true }

[dev-dependencies]
caramelo.workspace = true
tempfile = "3.27.0"
