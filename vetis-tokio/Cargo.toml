[package]
name = "vetis-tokio"
version = "0.1.1"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Very Tiny Server with tokio runtime"
readme = "README.md"
license.workspace = true
keywords = ["http", "networking", "tokio", "rest-server"]
publish = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true

[package.metadata.wix]
upgrade-guid = "76DF79DF-E1F9-40A7-89D1-3190562C7851"
path-guid = "FEA82F70-7E57-447F-A361-76FB5E25BA5F"
license = false
eula = false

[features]
default = [
  "http1",
  "http2",
  #"http3",
  "rust-tls"
]

rust-tls = ["tokio-rustls", "rustls", "rustls-provider"]

rustls-provider = ["__rustls_awc_lc_rs"]
__rustls_awc_lc_rs = ["futures-rustls/aws-lc-rs", "quinn/rustls-aws-lc-rs"]
__rustls_ring = ["futures-rustls/ring", "quinn/rustls-ring"]

http1 = [
  "hyper/http1",
  "hyper/server",
  "hyper-util/server",
  "hyper-body-utils/generic",
  "hyper-util/http1",
]
http2 = [
  "hyper/http2",
  "hyper/server",
  "hyper-util/server",
  "hyper-body-utils/generic",
  "hyper-util/http2",
]
http3 = [
  "dep:h3",
  "dep:h3-quinn",
  "hyper/server",
  "hyper-util/server",
  "hyper-body-utils/generic",
  "hyper-body-utils/generic-h3",
  "quinn/runtime-tokio",
]

[dependencies]
async-lock = { workspace = true }
base64 = { workspace = true, optional = true }
bytes = { workspace = true }
clap = { workspace = true }
env_logger = { workspace = true }
futures-lite = { workspace = true }
futures-rustls = { workspace = true, optional = true }
futures-util = { workspace = true }
h3 = { workspace = true, optional = true }
h3-quinn = { workspace = true, optional = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, optional = true, default-features = false }
hyper-body-utils = { workspace = true, optional = true, default-features = false }
hyper-util = { workspace = true, features = [
  "tokio",
], default-features = false }
log = { workspace = true }
mimalloc = { workspace = true }
peekable = { workspace = true, features = ["tokio"], default-features = false }
quinn = { workspace = true, optional = true }
radix_trie = { workspace = true }
rand = { workspace = true }
regex = {workspace = true, optional = true }
rustls = { workspace = true, optional = true }
serde = { workspace = true }
serde_yaml_ng = { workspace = true }
socket2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { version = "1.52.3", features = [
  "fs",
  "signal",
  "net",
  "rt-multi-thread",
], default-features = false }
tokio-rustls = { version = "0.26.0", optional = true, default-features = false }
tokio-util = { version = "0.7.18", features = ["io"], default-features = false }
typetag = { workspace = true }
url = { workspace = true }
vetis = { workspace = true, default-features = false }

[dev-dependencies]
deboa = { workspace = true }
deboa-tokio = { version = "0.1.2", default-features = false, features = [
  "http1",
  "http2",
  #"http3",
  "rust-tls",
  "default-rustls-provider",
  "default-rustls-verifier",
] }
tokio = { version = "1.52.3", default-features = false, features = [
  "macros",
  "rt-multi-thread",
] }
vetis-macros = { workspace = true }
