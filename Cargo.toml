[workspace]
# Use the latest resolver available
resolver = "3"
# Include both parts of the library in the workspace
members = [
  "vetis",
  "vetis-macros",
  #"examples/simple"
]

[workspace.package]
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
edition = "2021"
repository = "https://github.com/vetis-server/vetis"
homepage = "https://github.com/vetis-server/vetis"
license = "MIT OR Apache-2.0"
rust-version = "1.75.0"

[workspace.dependencies]
async-lock = "3.4.1"
base64 = { version = "0.23.1", default-features = false }
bytes = "1.12.1"
clap = { version = "4.6.6", default-features = false, features = [
  "std",
  "derive",
] }
deboa = { version = ">= 0.1.0" }
env_logger = "0.11.9"
futures-lite = { version = "2.6.1", default-features = false }
futures-rustls = { version = "0.26.0", default-features = false }
futures-util = { version = "0.3.32" }
h3 = { version = "0.0.8", default-features = false }
h3-quinn = { version = "0.0.10", default-features = false }
http = "1.4.2"
http-body-util = { version = "0.1.3" }
hyper = { version = "1.10.1", default-features = false }
hyper-body-utils = { version = ">= 0.1.14", default-features = false }
hyper-util = { version = "0.1.20", default-features = false }
log = "0.4.34"
mimalloc = "0.1.52"
peekable = { version = "0.6.1" }
quinn = { version = "0.11.11", default-features = false }
radix_trie = { version = "0.3.0", default-features = false }
rand = { version = "0.10.2", default-features = false }
regex = { version = "1.12.4", default-features = false }
rustls = { version = "0.23.40", default-features = false }
serde = "1.0.228"
serde_yaml_ng = "0.10.0"
socket2 = "0.6.4"
thiserror = "2.0.17"
time = { version = "0.3.55", features = ["formatting"] }
typetag = "0.2.22"
url = "2.5.7"
vetis = { path = "vetis", version = ">= 0.1.4"}
vetis-macros = { path = "vetis-macros" }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
