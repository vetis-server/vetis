[workspace]
resolver = "3"
members = ["vetis", "vetis-macros", "examples/simple"]

[workspace.package]
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
edition = "2024"
repository = "https://github.com/vetis-server/vetis"
homepage = "https://vetis-server.github.io/vetis"
license = "MIT OR Apache-2.0"
rust-version = "1.86.0"

[workspace.dependencies]
caramelo = "0.1.5"
compact_str = { version = "0.10.0", features = ["serde", "smallvec"] }
http = "1.5.0"
hyper = { version = "1.11.1", default-features = false }
hyper-body-utils = { version = "0.1.18", default-features = false }
log = "0.4.34"
logforth-core = "0.4.0"
serde = "1.0.228"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
typetag = "0.2.22"
vetis = { path = "vetis" }
vetis-macros = { path = "vetis-macros" }
vetis-matchers = { path = "../vetis-matchers" }
vetis-tokio = { path = "../vetis-tokio" }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

